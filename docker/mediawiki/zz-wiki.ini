; Westernis PHP overrides (uploads, memory, opcache, error handling)
display_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_STRICT
; PHP's fallback only: LocalSettings.php sets the wiki's timezone from WIKI_TIMEZONE in .env
date.timezone = Europe/Berlin
upload_max_filesize = 256M
post_max_size = 260M
memory_limit = 512M
max_execution_time = 300
max_input_vars = 5000
opcache.validate_timestamps = 1
opcache.revalidate_freq = 2
opcache.memory_consumption = 256
opcache.max_accelerated_files = 20000
apc.enable_cli = 1
apc.shm_size = 128M
