# Westernis: short URLs (/wiki/Title -> index.php) and static asset handling.
# Loaded via conf-enabled; the image's vhost has AllowOverride None so .htaccess is not used.
RewriteEngine On
# Root -> Main Page
RewriteRule ^/?$ %{DOCUMENT_ROOT}/index.php [L]
# /wiki/Title -> index.php (MediaWiki reads PATH_INFO)
RewriteRule ^/?wiki(/.*)?$ %{DOCUMENT_ROOT}/index.php [L]
AcceptPathInfo On

# Theme assets (fonts, css, js, images) mounted at /var/www/html/assets
<Directory /var/www/html/assets>
    Options -Indexes
    Require all granted
    <IfModule mod_headers.c>
        Header set Cache-Control "public, max-age=86400"
    </IfModule>
</Directory>

# Never execute uploaded PHP
<Directory /var/www/html/images>
    <FilesMatch "\.(php|phtml|php[0-9])$">
        Require all denied
    </FilesMatch>
</Directory>
