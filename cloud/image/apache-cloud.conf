# Westernis cloud image: Apache limits for one small container (docs/cloudflare-design.md section 2.8).
# Enabled as conf-available/westernis-cloud.conf next to wiki.conf; Apache listens on 8080 as www-data
# (ports.conf and the vhost are rewritten in cloud/image/Dockerfile). Apache allows no trailing comments.

# The image default (150 workers x memory_limit 512M) could exhaust the instance's memory, and an OOM kill
# means no final Litestream sync. 6 workers are plenty for one author plus the job loop.
<IfModule mpm_prefork_module>
    StartServers 2
    MinSpareServers 2
    MaxSpareServers 4
    ServerLimit 6
    MaxRequestWorkers 6
    MaxConnectionsPerChild 1000
</IfModule>

# The supervisor wst-start.sh stops Apache with SIGWINCH (graceful-stop): in-flight requests get up to 30 s
GracefulShutdownTimeout 30

# Apache runs as www-data, started by the root supervisor, so it may not reopen the container's stdout and
# stderr (/dev/stdout is root's pipe). Piped loggers write to the inherited descriptors instead. This
# replaces the global error log; the Dockerfile points the default vhost's logs at the same pipes and
# disables other-vhosts-access-log.
ErrorLog "|/usr/bin/cat"

# Only the Worker talks to this server; MediaWiki builds its URLs from $wgServer. Silences AH00558.
ServerName localhost

# A thumbnail the Worker did not find in R2: MediaWiki renders it, stores it in R2 and streams it back
RewriteEngine On
RewriteRule ^/?images/thumb/(archive/)?[0-9a-f]/[0-9a-f][0-9a-f]/[^/]+/[^/]+$ %{DOCUMENT_ROOT}/thumb_handler.php [L,QSA]
